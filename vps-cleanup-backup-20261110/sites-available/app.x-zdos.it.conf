server {
    listen 80;
    listen [::]:80;
    server_name app.x-zdos.it;
    return 301 https://app.x-zdos.it$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.x-zdos.it;

    ssl_certificate /etc/letsencrypt/live/app.x-zdos.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.x-zdos.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    location ~* \.(?:css|js|mjs|json|svg|woff2)$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
